[package]
name = "rzn_phone_worker"
version = "0.0.2"
edition = "2021"
description.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true

[[bin]]
name = "rzn-phone-worker"
path = "src/bin/rzn-phone-worker.rs"

[[bin]]
name = "rzn-phone"
path = "src/bin/rzn-phone.rs"
required-features = ["cli"]

[features]
# Keep the MCP worker as the cheap default; the terminal CLI is an explicit
# release target because it pulls a sizeable set of presentation/packaging
# dependencies.
default = []
cli = [
    "dep:base64",
    "dep:clap",
    "dep:colored",
    "dep:comfy-table",
    "dep:ed25519-dalek",
    "dep:flate2",
    "dep:sha2",
    "dep:strsim",
    "dep:tar",
    "dep:tempfile",
    "dep:terminal_size",
]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
once_cell = "1"
base64 = { version = "0.22", optional = true }
quick-xml = "0.38"
clap = { version = "4", features = ["derive"], optional = true }
strsim = { version = "0.11", optional = true }
colored = { version = "2", optional = true }
comfy-table = { version = "7", optional = true }
terminal_size = { version = "0.4", optional = true }
ed25519-dalek = { version = "2", optional = true }
flate2 = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
