[package]
name = "rzn_phone_worker"
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "rzn-phone-worker"
path = "src/bin/rzn-phone-worker.rs"

[[bin]]
name = "rzn-phone"
path = "src/bin/rzn-phone.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
once_cell = "1"
base64 = "0.22"
quick-xml = "0.38"
clap = { version = "4", features = ["derive"] }
strsim = "0.11"
colored = "2"
comfy-table = "7"
terminal_size = "0.4"

[dev-dependencies]
httpmock = "0.7"
