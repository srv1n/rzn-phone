<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
<rect width="1600" height="900" fill="#FAFAF7"/>
<foreignObject x="0" y="0" width="1600" height="900">
<div xmlns="http://www.w3.org/1999/xhtml" class="rzn" style="width:1600px;height:900px;font-size:16px;line-height:1.2;font-family:'Geist Mono',ui-monospace,Menlo,monospace;color:#1A1A17;">
<style type="text/css">
.rzn, .rzn * { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; box-sizing: border-box; margin: 0; padding: 0; }
.rzn .canvas { width: 1600px; height: 900px; background: #FAFAF7; padding: 56px 80px 40px; display: flex; flex-direction: column; }
.rzn .matrix { margin-top: 8px; flex: 1; display: grid; grid-template-columns: 280px repeat(4, 1fr); column-gap: 0; }
.rzn .matrix .col-header { padding: 14px 18px 14px; border-bottom: 1px solid rgba(26,26,23,0.12); display: flex; flex-direction: column; gap: 4px; position: relative; }
.rzn .matrix .col-header .cat { font-size: 10px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: #6B6558; }
.rzn .matrix .col-header .name { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: #1A1A17; }
.rzn .matrix .col-header .tech { font-size: 11px; color: #6B6558; }
.rzn .matrix .col-header.us { background: rgba(63,111,26,0.08); border-top: 4px solid #3F6F1A; border-left: 1px solid #3F6F1A; border-right: 1px solid #3F6F1A; }
.rzn .matrix .col-header.us .cat { color: #3F6F1A; }
.rzn .matrix .col-header.us .badge { position: absolute; top: 10px; right: 14px; font-size: 9px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #FAFAF7; background: #3F6F1A; padding: 3px 8px; border-radius: 2px; }
.rzn .matrix .row-head { padding: 14px 18px; border-bottom: 1px solid rgba(26,26,23,0.12); border-right: 1px solid rgba(26,26,23,0.12); display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.rzn .matrix .row-head .name { font-size: 14px; font-weight: 600; color: #1A1A17; }
.rzn .matrix .row-head .sub { font-size: 11px; color: #6B6558; }
.rzn .matrix .cell { padding: 14px 18px; border-bottom: 1px solid rgba(26,26,23,0.12); display: flex; flex-direction: column; gap: 6px; justify-content: center; }
.rzn .matrix .cell.us { background: rgba(63,111,26,0.08); border-left: 1px solid #3F6F1A; border-right: 1px solid #3F6F1A; }
.rzn .matrix .cell.us:last-child { border-bottom: 1px solid #3F6F1A; }
.rzn .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; align-self: flex-start; }
.rzn .pill::before { content: ""; width: 10px; height: 10px; border-radius: 999px; display: inline-block; }
.rzn .pill.yes { background: rgba(63,111,26,0.08); color: #3F6F1A; }
.rzn .pill.yes::before { background: #3F6F1A; }
.rzn .pill.partial { background: rgba(217,119,6,0.12); color: #B15F05; }
.rzn .pill.partial::before { background: #D97706; }
.rzn .pill.no { background: rgba(107,101,88,0.12); color: #6B6558; }
.rzn .pill.no::before { background: #C5BDAA; }
.rzn .pill.note { background: transparent; color: #6B6558; padding-left: 0; }
.rzn .pill.note::before { display: none; }
.rzn .matrix .cell .detail { font-size: 11px; color: #3A352D; line-height: 1.4; }
.rzn .legend { border-top: 0.8px solid rgba(26,26,23,0.12); padding-top: 12px; margin-top: 16px; display: flex; align-items: center; gap: 28px; font-size: 11px; color: #6B6558; font-weight: 500; }
.rzn .legend .label-eyebrow { font-size: 11px; letter-spacing: 0.15em; font-weight: 500; text-transform: uppercase; color: #6B6558; margin-right: 12px; }
.rzn .legend .item { display: inline-flex; align-items: center; gap: 8px; }
.rzn .legend .swatch { width: 14px; height: 10px; border-radius: 2px; border: 0.8px solid rgba(26,26,23,0.12); display: inline-block; }
</style>
<div class="canvas">
  <div style="font-size:11px;font-weight:600;letter-spacing:0.15em;color:#3A352D;text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-bottom:20px;line-height:1;">
    <span style="width:8px;height:8px;background:#3F6F1A;border-radius:999px;display:inline-block;"></span>
    <span>RZN · Phone Automation · 05 · Comparison</span>
  </div>
  <div style="font-size:44px;font-weight:700;letter-spacing:-0.01em;line-height:1.08;color:#1A1A17;margin-bottom:12px;">Why not just use Appium directly?</div>
  <div style="font-size:15px;font-weight:400;line-height:1.45;color:#3A352D;max-width:1300px;">Four options for driving a real iPhone from your Mac. The runtime packages Appium's annoying parts — device checks, session bootstrap, compact snapshots, workflow packs, safety gates — so phone tasks are installable, inspectable, and reusable.</div>

  <div style="flex:1;position:relative;padding:12px 0 0;display:flex;flex-direction:column;">
    <div class="matrix">
      <div></div>
      <div class="col-header us">
        <span class="badge">Ours</span>
        <span class="cat">Runtime</span>
        <span class="name">rzn-phone</span>
        <span class="tech">Rust runtime · MCP worker · workflow pack</span>
      </div>
      <div class="col-header">
        <span class="cat">Primitive</span>
        <span class="name">Raw Appium</span>
        <span class="tech">WebDriver · you bring the harness</span>
      </div>
      <div class="col-header">
        <span class="cat">Built-in</span>
        <span class="name">Apple Shortcuts</span>
        <span class="tech">on-device automation app</span>
      </div>
      <div class="col-header">
        <span class="cat">Dev-tool</span>
        <span class="name">XCTest UI</span>
        <span class="tech">Xcode test target · Swift</span>
      </div>

      <div class="row-head">
        <span class="name">Drive a real iPhone</span>
        <span class="sub">from macOS, not a simulator</span>
      </div>
      <div class="cell us"><span class="pill yes">Yes</span><span class="detail">trusted device, your logged-in apps</span></div>
      <div class="cell"><span class="pill yes">Yes</span><span class="detail">raw, you wire Appium + WDA yourself</span></div>
      <div class="cell"><span class="pill partial">Partial</span><span class="detail">on-device only, not remote-controlled</span></div>
      <div class="cell"><span class="pill yes">Yes</span><span class="detail">but needs Xcode test target</span></div>

      <div class="row-head">
        <span class="name">Named workflows</span>
        <span class="sub">ship, inspect, update out of band</span>
      </div>
      <div class="cell us"><span class="pill yes">51 built-in</span><span class="detail">Safari, App Store, Messages OTP, social</span></div>
      <div class="cell"><span class="pill no">None</span><span class="detail">you build a harness per task</span></div>
      <div class="cell"><span class="pill partial">User-authored</span><span class="detail">GUI-built, not code-versionable</span></div>
      <div class="cell"><span class="pill no">None</span><span class="detail">you write Swift test classes</span></div>

      <div class="row-head">
        <span class="name">LLM-friendly snapshot</span>
        <span class="sub">observe → decide → act → verify</span>
      </div>
      <div class="cell us"><span class="pill yes">2–8&#160;KB</span><span class="detail">encoded ids · btn_3, fld_1</span></div>
      <div class="cell"><span class="pill no">50–200&#160;KB</span><span class="detail">raw XML page source</span></div>
      <div class="cell"><span class="pill no">N/A</span><span class="detail">no agent surface</span></div>
      <div class="cell"><span class="pill no">N/A</span><span class="detail">assertion-based, not agent-based</span></div>

      <div class="row-head">
        <span class="name">MCP / agent surface</span>
        <span class="sub">drop into Codex, Claude, etc.</span>
      </div>
      <div class="cell us"><span class="pill yes">Built in</span><span class="detail">rzn-phone worker over stdio</span></div>
      <div class="cell"><span class="pill no">DIY</span><span class="detail">bridge WebDriver to MCP yourself</span></div>
      <div class="cell"><span class="pill no">No</span><span class="detail">closed to agents</span></div>
      <div class="cell"><span class="pill no">No</span><span class="detail">test runner, not a server</span></div>

      <div class="row-head">
        <span class="name">Safety model</span>
        <span class="sub">default-safe for write actions</span>
      </div>
      <div class="cell us"><span class="pill yes">Dry-run by default</span><span class="detail">execute-flag + commit=1 · centralised</span></div>
      <div class="cell"><span class="pill no">None</span><span class="detail">every click runs immediately</span></div>
      <div class="cell"><span class="pill partial">Per-shortcut</span><span class="detail">manual confirmation prompts</span></div>
      <div class="cell"><span class="pill no">None</span><span class="detail">tests run what they assert</span></div>

      <div class="row-head">
        <span class="name">Install shape</span>
        <span class="sub">what you put on the machine</span>
      </div>
      <div class="cell us"><span class="pill note">One Rust binary + workflow pack</span><span class="detail">make install · versioned separately</span></div>
      <div class="cell"><span class="pill note">Appium + XCUITest + glue</span><span class="detail">Node, drivers, config, harness</span></div>
      <div class="cell"><span class="pill note">iOS app</span><span class="detail">on-device, no headless story</span></div>
      <div class="cell"><span class="pill note">Xcode project</span><span class="detail">requires full Xcode install</span></div>
    </div>

    <div class="legend">
      <span class="label-eyebrow">Legend</span>
      <span class="item"><span class="swatch" style="background:rgba(63,111,26,0.08);border-color:#3F6F1A;"></span>positive</span>
      <span class="item"><span class="swatch" style="background:rgba(217,119,6,0.18);border-color:#D97706;"></span>partial</span>
      <span class="item"><span class="swatch" style="background:rgba(107,101,88,0.18);border-color:#C5BDAA;"></span>missing</span>
      <span class="item" style="margin-left:auto;color:#3A352D;">Tinted column = rzn-phone</span>
    </div>
  </div>

  <div style="height:36px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(26,26,23,0.12);padding-top:14px;font-size:11px;font-weight:500;letter-spacing:0.15em;color:#6B6558;text-transform:uppercase;">
    <span>RZN · Phone Automation · Comparison</span>
    <span>05 / 05</span>
  </div>
</div>
</div>
</foreignObject>
</svg>
