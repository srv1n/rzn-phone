<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
<rect width="1600" height="900" fill="#FAFAF7"/>
<foreignObject x="0" y="0" width="1600" height="900">
<div xmlns="http://www.w3.org/1999/xhtml" class="rzn" style="width:1600px;height:900px;font-size:16px;line-height:1.2;font-family:'Geist Mono',ui-monospace,Menlo,monospace;color:#1A1A17;">
<style type="text/css">
.rzn, .rzn * { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; box-sizing: border-box; margin: 0; padding: 0; }
.rzn .canvas { width: 1600px; height: 900px; background: #FAFAF7; padding: 56px 80px 40px; display: flex; flex-direction: column; }
.rzn .body-band { flex: 1; position: relative; background-image: radial-gradient(circle at 1px 1px, rgba(26,26,23,0.07) 0.9px, transparent 0.9px); background-size: 22px 22px; padding: 20px 0 8px; display: flex; flex-direction: column; }
.rzn .legend { border-top: 0.8px solid rgba(26,26,23,0.12); padding-top: 12px; margin-top: 16px; display: flex; align-items: center; gap: 28px; font-size: 11px; color: #6B6558; font-weight: 500; }
.rzn .legend .label-eyebrow { font-size: 11px; letter-spacing: 0.15em; font-weight: 500; text-transform: uppercase; color: #6B6558; margin-right: 12px; }
.rzn .legend .item { display: inline-flex; align-items: center; gap: 8px; }
.rzn .legend .swatch { width: 14px; height: 10px; border-radius: 2px; border: 0.8px solid rgba(26,26,23,0.12); display: inline-block; }
.rzn .legend .swatch.accent { background: rgba(63,111,26,0.08); border-color: #3F6F1A; }
.rzn .legend .swatch.flow { background: rgba(26,69,150,0.08); border-color: #1A4596; }
.rzn .legend .swatch.ink { background: #F4F1EA; border-color: #3A352D; }

.rzn .seq { margin-top: 4px; flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); position: relative; }
.rzn .actor { display: flex; flex-direction: column; align-items: center; padding: 0 8px; position: relative; z-index: 2; }
.rzn .actor .head { width: 200px; border: 1.5px solid #3A352D; background: #F4F1EA; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.rzn .actor .head.accent { border-color: #3F6F1A; background: rgba(63,111,26,0.08); }
.rzn .actor .head.flow { border-color: #1A4596; background: rgba(26,69,150,0.08); }
.rzn .actor .head .tag { font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6558; }
.rzn .actor .head.accent .tag { color: #3F6F1A; }
.rzn .actor .head.flow .tag { color: #1A4596; }
.rzn .actor .head .name { font-size: 14px; font-weight: 600; color: #1A1A17; }
.rzn .actor .head .tech { font-size: 10px; color: #6B6558; }
.rzn .lifelines { position: absolute; top: 82px; bottom: 0; left: 0; right: 0; pointer-events: none; z-index: 0; }
.rzn .lifeline { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed #6B6558; }
.rzn .messages { position: absolute; top: 82px; bottom: 0; left: 0; right: 0; z-index: 1; }
.rzn .msg { position: absolute; height: 24px; display: flex; align-items: center; opacity: 1; }
.rzn .msg .line { flex: 1; height: 1.5px; background: #3A352D; position: relative; }
.rzn .msg .line.dash { background: transparent; border-top: 1.5px dashed #3A352D; height: 0; }
.rzn .msg .line.accent { background: #3F6F1A; }
.rzn .msg .line.flow { background: #1A4596; }
.rzn .msg .line.dash.accent { border-top-color: #3F6F1A; }
.rzn .msg .head.right::after { content: ""; position: absolute; right: 0; top: 50%; transform: translateY(-50%); border-left: 7px solid #3A352D; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
.rzn .msg .head.right.accent::after { border-left-color: #3F6F1A; }
.rzn .msg .head.right.flow::after { border-left-color: #1A4596; }
.rzn .msg .head.left::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); border-right: 7px solid #3A352D; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
.rzn .msg .head.left.flow::before { border-right-color: #1A4596; }
.rzn .msg .head.left.accent::before { border-right-color: #3F6F1A; }
.rzn .msg-label { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); background: #FAFAF7; padding: 0 8px; font-size: 12px; font-weight: 500; color: #1A1A17; white-space: nowrap; letter-spacing: 0; line-height: 1.2; }
.rzn .msg-label .kind { font-size: 9px; color: #6B6558; letter-spacing: 0.14em; text-transform: uppercase; margin-right: 6px; font-weight: 600; }
.rzn .msg-label.below { top: 16px; }
.rzn .loop { position: absolute; border: 1px solid #3A352D; border-radius: 6px; background: transparent; z-index: 0; }
.rzn .loop::before { content: attr(data-label); position: absolute; top: 0; left: 0; background: #3A352D; color: #FAFAF7; font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px 0 6px 0; }
</style>
<div class="canvas">
  <div style="font-size:11px;font-weight:600;letter-spacing:0.15em;color:#3A352D;text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-bottom:20px;line-height:1;">
    <span style="width:8px;height:8px;background:#3F6F1A;border-radius:999px;display:inline-block;"></span>
    <span>RZN · Phone Automation · 04 · Sequence · one workflow run</span>
  </div>
  <div style="font-size:44px;font-weight:700;letter-spacing:-0.01em;line-height:1.08;color:#1A1A17;margin-bottom:12px;">Observe · decide · act · verify — per step.</div>
  <div style="font-size:15px;font-weight:400;line-height:1.45;color:#3A352D;max-width:1200px;">A workflow is a loop, not a script. Each step observes the UI, picks a target from encoded ids, acts through Appium, and re-observes before the next step. Read-only by default; mutating steps require <code>commit=1</code> and the workflow's execute-flag.</div>

  <div class="body-band">
    <div class="seq">

      <div class="actor">
        <div class="head">
          <span class="tag">Client</span>
          <span class="name">You or your agent</span>
          <span class="tech">CLI · MCP</span>
        </div>
      </div>
      <div class="actor">
        <div class="head accent">
          <span class="tag">Core</span>
          <span class="name">rzn-phone runtime</span>
          <span class="tech">workflow executor</span>
        </div>
      </div>
      <div class="actor">
        <div class="head flow">
          <span class="tag">Bridge</span>
          <span class="name">Appium + XCUITest</span>
          <span class="tech">WebDriver · WDA</span>
        </div>
      </div>
      <div class="actor">
        <div class="head flow">
          <span class="tag">Device</span>
          <span class="name">Trusted iPhone</span>
          <span class="tech">real app state</span>
        </div>
      </div>

      <div class="lifelines">
        <div class="lifeline" style="left: 12.5%"></div>
        <div class="lifeline" style="left: 37.5%"></div>
        <div class="lifeline" style="left: 62.5%"></div>
        <div class="lifeline" style="left: 87.5%"></div>
      </div>

      <div class="messages">

        <div class="msg" style="left: 12.5%; width: 25%; top: 14px;">
          <div class="line"></div>
          <div class="head right"></div>
          <div class="msg-label">
            <span class="kind">Invoke</span>rzn-phone run safari/google_search
          </div>
        </div>

        <div class="loop" data-label="Loop · per workflow step" style="left: 30%; right: 4%; top: 60px; bottom: 58px;"></div>

        <div class="msg" style="left: 37.5%; width: 25%; top: 104px;">
          <div class="line accent"></div>
          <div class="head right accent"></div>
          <div class="msg-label"><span class="kind">1 · Observe</span>observe_compact</div>
        </div>

        <div class="msg" style="left: 62.5%; width: 25%; top: 152px;">
          <div class="line flow"></div>
          <div class="head right flow"></div>
          <div class="msg-label"><span class="kind">2 · Fetch</span>UI tree (50–200&#160;KB)</div>
        </div>

        <div class="msg" style="left: 37.5%; width: 50%; top: 198px;">
          <div class="line dash accent"></div>
          <div class="head left accent"></div>
          <div class="msg-label below"><span class="kind">Return</span>2–8&#160;KB compact · encoded ids (btn_3, fld_1)</div>
        </div>

        <div class="msg" style="left: 37.5%; width: 25%; top: 256px;">
          <div class="line accent"></div>
          <div class="head right accent"></div>
          <div class="msg-label"><span class="kind">3 · Act</span>resolve(btn_3) · tap · type · scroll</div>
        </div>

        <div class="msg" style="left: 62.5%; width: 25%; top: 302px;">
          <div class="line flow"></div>
          <div class="head right flow"></div>
          <div class="msg-label"><span class="kind">4 · Gesture</span>XCUITest event</div>
        </div>

        <div class="msg" style="left: 37.5%; width: 50%; top: 354px;">
          <div class="line dash accent"></div>
          <div class="head left accent"></div>
          <div class="msg-label below"><span class="kind">5 · Verify</span>re-observe · assert post-state</div>
        </div>

        <div class="msg" style="left: 12.5%; width: 25%; top: 416px;">
          <div class="line dash"></div>
          <div class="head left"></div>
          <div class="msg-label below"><span class="kind">Result</span>JSON · screenshots · UI source</div>
        </div>

      </div>
    </div>

    <div class="legend">
      <span class="label-eyebrow">Legend</span>
      <span class="item"><span class="swatch ink"></span>client</span>
      <span class="item"><span class="swatch accent"></span>ours · runtime</span>
      <span class="item"><span class="swatch flow"></span>external · bridge + device</span>
      <span class="item" style="margin-left:auto;color:#3A352D">Solid = call · Dashed = return</span>
    </div>
  </div>

  <div style="height:36px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(26,26,23,0.12);padding-top:14px;font-size:11px;font-weight:500;letter-spacing:0.15em;color:#6B6558;text-transform:uppercase;">
    <span>RZN · Phone Automation · Sequence</span>
    <span>04 / 05</span>
  </div>
</div>
</div>
</foreignObject>
</svg>
