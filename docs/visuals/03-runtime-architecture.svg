<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
<rect width="1600" height="900" fill="#FAFAF7"/>
<foreignObject x="0" y="0" width="1600" height="900">
<div xmlns="http://www.w3.org/1999/xhtml" class="rzn" style="width:1600px;height:900px;font-size:16px;line-height:1.2;font-family:'Geist Mono',ui-monospace,Menlo,monospace;color:#1A1A17;">
<style type="text/css">
.rzn, .rzn * { font-family: 'Geist Mono', ui-monospace, Menlo, monospace; box-sizing: border-box; margin: 0; padding: 0; }
.rzn .canvas { width: 1600px; height: 900px; background: #FAFAF7; padding: 56px 80px 40px; display: flex; flex-direction: column; }
.rzn .body-band { flex: 1; position: relative; background-image: radial-gradient(circle at 1px 1px, rgba(26,26,23,0.07) 0.9px, transparent 0.9px); background-size: 22px 22px; padding: 20px 0 16px; display: flex; flex-direction: column; }
.rzn .layout { display: grid; grid-template-columns: 230px 56px 1fr 56px 210px; column-gap: 12px; align-items: stretch; flex: 1; }
.rzn .col-label { font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: #6B6558; text-align: center; margin-bottom: 12px; }
.rzn .side-col { display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.rzn .process { position: relative; border: 1px dashed #3A352D; border-radius: 16px; padding: 40px 28px 28px; background: #FAFAF7; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; gap: 18px 20px; }
.rzn .process-tag { position: absolute; top: -12px; left: 20px; background: #FAFAF7; padding: 0 10px; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #3A352D; }
.rzn .process-sub { position: absolute; top: -12px; right: 20px; background: #FAFAF7; padding: 0 10px; font-size: 10px; color: #6B6558; letter-spacing: 0.1em; text-transform: uppercase; }
.rzn .comp { background: #FAFAF7; border: 1.5px solid #3A352D; border-radius: 8px; padding: 28px 14px 14px; position: relative; display: flex; flex-direction: column; gap: 2px; min-height: 100px; }
.rzn .comp.accent { border-color: #3F6F1A; background: rgba(63,111,26,0.08); }
.rzn .comp.flow { border-color: #1A4596; background: rgba(26,69,150,0.08); }
.rzn .comp.wide { grid-column: span 2; }
.rzn .comp.muted { border-color: #E8E3D6; background: #F4F1EA; }
.rzn .comp .tag { position: absolute; top: 8px; left: 12px; font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #3A352D; border: 0.8px solid #E8E3D6; padding: 2px 6px; border-radius: 2px; background: #FAFAF7; }
.rzn .comp.accent .tag { color: #3F6F1A; border-color: #3F6F1A; }
.rzn .comp.flow .tag { color: #1A4596; border-color: #1A4596; }
.rzn .comp .name { font-size: 14px; font-weight: 600; color: #1A1A17; }
.rzn .comp .tech { font-size: 11px; color: #6B6558; line-height: 1.45; }
.rzn .entry { border: 1.5px solid #3A352D; background: #F4F1EA; border-radius: 999px; padding: 14px 22px; display: flex; align-items: center; gap: 14px; justify-content: center; }
.rzn .entry .slot { display: flex; flex-direction: column; gap: 2px; text-align: center; }
.rzn .entry .slot .name { font-size: 13px; font-weight: 600; }
.rzn .entry .slot .tech { font-size: 10px; color: #6B6558; }
.rzn .entry .sep { width: 1px; height: 28px; background: rgba(26,26,23,0.12); }
.rzn .ext { background: rgba(26,69,150,0.08); border: 1.5px solid #1A4596; border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.rzn .ext .tag { font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #1A4596; margin-bottom: 2px; }
.rzn .ext .name { font-size: 14px; font-weight: 600; color: #1A1A17; }
.rzn .ext .tech { font-size: 11px; color: #3A352D; }
.rzn .ext .where { font-size: 10px; color: #1A4596; margin-top: 4px; }
.rzn .col-arrow { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-top: 36px; }
.rzn .col-arrow .pair { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rzn .col-arrow .pair .line { width: 52px; height: 1.5px; background: #3A352D; position: relative; }
.rzn .col-arrow .pair.in .line::after { content: ""; position: absolute; right: 0; top: 50%; transform: translateY(-50%); border-left: 7px solid #3A352D; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
.rzn .col-arrow .pair .label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; color: #3A352D; white-space: nowrap; }
.rzn .device-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.rzn .device { width: 120px; height: 210px; background: #1A1A17; border-radius: 20px; padding: 8px; position: relative; display: flex; flex-direction: column; }
.rzn .device .screen { flex: 1; background: #FAFAF7; border-radius: 12px; padding: 14px 8px 8px; position: relative; }
.rzn .device .island { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 32px; height: 8px; background: #1A1A17; border-radius: 4px; }
.rzn .device .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-top: 6px; }
.rzn .device .grid .cell { aspect-ratio: 1; background: #3A352D; border-radius: 3px; }
.rzn .device .grid .cell.hit { background: #3F6F1A; }
.rzn .device-caption { font-size: 11px; text-align: center; color: #6B6558; }
.rzn .device-caption .n { display: block; font-size: 13px; font-weight: 600; color: #1A1A17; }
.rzn .legend { border-top: 0.8px solid rgba(26,26,23,0.12); padding-top: 12px; margin-top: 16px; display: flex; align-items: center; gap: 28px; font-size: 11px; color: #6B6558; font-weight: 500; }
.rzn .legend .label-eyebrow { font-size: 11px; letter-spacing: 0.15em; font-weight: 500; text-transform: uppercase; color: #6B6558; margin-right: 12px; }
.rzn .legend .item { display: inline-flex; align-items: center; gap: 8px; }
.rzn .legend .swatch { width: 14px; height: 10px; border-radius: 2px; border: 0.8px solid rgba(26,26,23,0.12); display: inline-block; }
.rzn .legend .swatch.accent { background: rgba(63,111,26,0.08); border-color: #3F6F1A; }
.rzn .legend .swatch.flow { background: rgba(26,69,150,0.08); border-color: #1A4596; }
.rzn .legend .swatch.ink { background: #F4F1EA; border-color: #3A352D; }
</style>
<div class="canvas">
  <div style="font-size:11px;font-weight:600;letter-spacing:0.15em;color:#3A352D;text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-bottom:20px;line-height:1;">
    <span style="width:8px;height:8px;background:#3F6F1A;border-radius:999px;display:inline-block;"></span>
    <span>RZN · Phone Automation · 03 · Runtime architecture</span>
  </div>
  <div style="font-size:44px;font-weight:700;letter-spacing:-0.01em;line-height:1.08;color:#1A1A17;margin-bottom:12px;">One macOS binary. Two entry surfaces.</div>
  <div style="font-size:15px;font-weight:400;line-height:1.45;color:#3A352D;max-width:1100px;">Everything inside the boundary ships in one install. Appium + XCUITest is the standard-tool edge; the iPhone is the destination. The runtime never talks to the device directly — that's the bridge's job.</div>

  <div class="body-band">
    <div class="layout">
      <div class="side-col">
        <div class="col-label">Clients</div>
        <div class="entry">
          <div class="slot"><span class="name">rzn-phone</span><span class="tech">CLI · terminal</span></div>
          <div class="sep"></div>
          <div class="slot"><span class="name">rzn-phone worker</span><span class="tech">MCP · stdio</span></div>
        </div>
        <div class="comp muted" style="padding-top:22px">
          <span class="tag">Host</span>
          <div class="name">LLM / agent / operator</div>
          <div class="tech">Codex · Claude-compatible · shell</div>
        </div>
      </div>

      <div class="col-arrow">
        <div class="pair in">
          <span class="label">call</span>
          <div class="line"></div>
          <span class="label" style="color:#6B6558">JSON-RPC</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column">
        <div class="col-label">&#160;</div>
        <div class="process">
          <span class="process-tag">RZN-Phone process</span>
          <span class="process-sub">installed via make install</span>

          <div class="comp accent wide">
            <span class="tag">Core</span>
            <div class="name">Phone Automation Runtime</div>
            <div class="tech">workflow executor · session manager · smart-cache (5m TTL)</div>
          </div>

          <div class="comp">
            <span class="tag">Data</span>
            <div class="name">Workflow pack</div>
            <div class="tech">51 workflows · JSON · versioned separately</div>
          </div>

          <div class="comp">
            <span class="tag">Lib</span>
            <div class="name">Capability catalog</div>
            <div class="tech">Tier 1 planner verbs · Tier 2 direct tools</div>
          </div>

          <div class="comp">
            <span class="tag">Lib</span>
            <div class="name">Safety gates</div>
            <div class="tech">execute-flag · commit=1 · dry-run default</div>
          </div>

          <div class="comp">
            <span class="tag">Io</span>
            <div class="name">Artifacts</div>
            <div class="tech">JSON · screenshots · UI source</div>
          </div>
        </div>
      </div>

      <div class="col-arrow">
        <div class="pair in">
          <span class="label">observe / act</span>
          <div class="line"></div>
          <span class="label" style="color:#6B6558">WebDriver</span>
        </div>
      </div>

      <div class="side-col">
        <div class="col-label">External · not ours</div>
        <div class="ext">
          <span class="tag">Bridge</span>
          <div class="name">Appium + XCUITest</div>
          <div class="tech">WebDriver · WDA tunnel</div>
          <div class="where">macOS · Xcode · Node</div>
        </div>
        <div class="device-wrap">
          <div class="device">
            <div class="screen">
              <div class="island"></div>
              <div class="grid">
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell hit"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
              </div>
            </div>
          </div>
          <div class="device-caption">
            <span class="n">Trusted iPhone</span>
            iOS 17+ · unlocked
          </div>
        </div>
      </div>
    </div>

    <div class="legend">
      <span class="label-eyebrow">Legend</span>
      <span class="item"><span class="swatch accent"></span>ours · inside the boundary</span>
      <span class="item"><span class="swatch ink"></span>client host</span>
      <span class="item"><span class="swatch flow"></span>external surface</span>
      <span class="item" style="margin-left:auto;color:#3A352D">Dashed boundary = single macOS process</span>
    </div>
  </div>

  <div style="height:36px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(26,26,23,0.12);padding-top:14px;font-size:11px;font-weight:500;letter-spacing:0.15em;color:#6B6558;text-transform:uppercase;">
    <span>RZN · Phone Automation · Runtime architecture</span>
    <span>03 / 05</span>
  </div>
</div>
</div>
</foreignObject>
</svg>
