name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      repo: ${{ steps.vars.outputs.repo }}
    steps:
      # Action SHAs intentionally pin the current reviewed majors/tags. Do not
      # bump action majors here; Node 24 action-major compatibility is tracked
      # by phone-msi.
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Python validation dependencies
        shell: bash
        run: python3 -m pip install jsonschema

      - name: Validate tag/version sync
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          BUNDLE_VERSION="$(python scripts/release_common.py current-version)"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "invalid release version: $VERSION" >&2
            exit 1
          fi

          if [[ "$VERSION" != "$BUNDLE_VERSION" ]]; then
            echo "tag $TAG does not match bundle version $BUNDLE_VERSION" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Pre-packaging quality gate
        shell: bash
        run: make release-check

  build-worker:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux_x86_64
            binary: target/release/rzn-phone-worker
          - runner: windows-latest
            platform: windows_x86_64
            binary: target/release/rzn-phone-worker.exe
          - runner: macos-15-intel
            platform: macos_x86_64
            binary: target/release/rzn-phone-worker
          - runner: macos-15
            platform: macos_arm64
            binary: target/release/rzn-phone-worker
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build worker
        shell: bash
        run: cargo build -p rzn_phone_worker --release

      - name: Package standalone worker bundle
        shell: bash
        run: |
          python scripts/build_worker_release_assets.py \
            --platform "${{ matrix.platform }}" \
            --binary "${{ matrix.binary }}"

      - name: Upload raw macOS binary
        if: startsWith(matrix.platform, 'macos_')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raw-binary-${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: dist/worker-releases/rzn-phone/${{ needs.validate.outputs.version }}/${{ matrix.platform }}
          if-no-files-found: error

  build-macos-universal:
    needs: [validate, build-worker]
    runs-on: macos-15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build universal runtime archive
        shell: bash
        env:
          RELEASE_SIGNING_KEY_B64: ${{ secrets.RZN_PHONE_RELEASE_SIGNING_KEY }}
        run: |
          scripts/build_universal.sh
          test -x dist/bin/macos/universal/rzn-phone
          test -x dist/bin/macos/universal/rzn-phone-worker
          if [[ -z "$RELEASE_SIGNING_KEY_B64" ]]; then
            echo "RZN_PHONE_RELEASE_SIGNING_KEY secret is not set" >&2
            exit 1
          fi
          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY_B64" > "$KEYFILE"
          python scripts/build_release_artifacts.py --platform macos_universal --signing-key "$KEYFILE"

      - name: Upload universal runtime assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-macos_universal
          path: dist/releases/rzn-phone/${{ needs.validate.outputs.version }}/macos_universal
          if-no-files-found: error

  publish:
    needs: [validate, build-worker, build-macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_RELEASE_NOTES_MODEL: ${{ vars.OPENAI_RELEASE_NOTES_MODEL }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download packaged assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-assets-*
          path: dist/publish

      - name: Rename flat installer asset
        shell: bash
        run: |
          INSTALLER="$(find dist/publish -type f -name 'install.sh' | head -n1 || true)"
          if [[ -n "$INSTALLER" ]]; then
            cp "$INSTALLER" dist/publish/rzn-phone-install.sh
          fi

      - name: Generate release notes
        shell: bash
        run: |
          python scripts/generate_release_notes.py \
            --current-tag "${{ needs.validate.outputs.tag }}" \
            --repo "${{ needs.validate.outputs.repo }}" \
            --output dist/release-notes.md

      - name: Publish GitHub release
        shell: bash
        run: |
          TAG="${{ needs.validate.outputs.tag }}"
          VERSION="${{ needs.validate.outputs.version }}"
          TITLE="rzn-phone ${VERSION}"
          mapfile -d '' ASSETS < <(
            find dist/publish -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o -name '*.sig' -o -name 'rzn-phone-install.sh' \) \
              -print0 | sort -z
          )
          [[ "${#ASSETS[@]}" -gt 0 ]] || { echo "no release assets found" >&2; exit 1; }

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file dist/release-notes.md --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "$TITLE" \
              --notes-file dist/release-notes.md \
              --verify-tag \
              --latest
          fi
